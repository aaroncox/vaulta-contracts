name: Contract Tests
on: push
jobs:
    clang-formatting-check:
        name: clang-format check
        runs-on: ubuntu-latest
        strategy:
            matrix:
                path:
                    - 'contracts/api/src'
                    - 'contracts/api/include/api'
                    - 'contracts/registry/src'
                    - 'contracts/registry/include/registry'
                    - 'contracts/sentiment/src'
                    - 'contracts/sentiment/include/sentiment'
        steps:
            - uses: actions/checkout@v3
            - name: Run clang-format style check
              uses: jidicula/clang-format-action@v4.11.0
              with:
                  clang-format-version: '16'
                  check-path: ${{ matrix.path }}
    run-unit-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [18]
        name: Tests
        steps:
            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: actions/checkout@v3
            - uses: oven-sh/setup-bun@v1
            - name: Install dependencies
              run: make node_modules
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  install: true
            - name: Cache toolchain image layers
              uses: actions/cache@v4
              with:
                  path: /tmp/.buildx-cache
                  key: cdt-image-${{ hashFiles('docker/Dockerfile', '.env') }}
            - name: Run checks
              run: make jscheck
            - name: Run tests
              run: make test DOCKER_BUILD_FLAGS="--load --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache,mode=max"
